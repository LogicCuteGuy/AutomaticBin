[package]
name = "automatic_bin"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "1.1.1", features = ["esp32", "log-04", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
defmt = "0.3.5"
defmt-rtt = "0.4.0"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
